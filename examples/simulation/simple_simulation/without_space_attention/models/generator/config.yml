model_config:
  decoder_parameters:
    channel_attention_dropout: 1.0
    dropout: 0.2
    feed_forward_activation: leaky_relu
    feed_forward_dim: 100
    latent_sequence_length: 40
    model_dim: 100
    n_heads: 4
    n_layers: 4
    n_patches: 20
    patch_length: 4
    unpatched_length: 12
    within_channel_attention_dropout: 0.0
  input_parameters:
    channel_embedding_dim: 20
    embedding_dim: 100
    pos_embedding_dim: 100
    token_embedding_dim: 100
  loss_parameters:
    loss_sequence_length: 8
  n_channels: 4
  name: ephys_gpt
  sequence_length: 80
  tokenizer_path: ../models/tokenizer
training_config:
  batch_size: 8
  checkpoint:
    save_dir: models/generator
  n_epochs: 40
  optimizer:
    learning_rate: 2.0e-05
